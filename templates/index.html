<!DOCTYPE html>
<html>

<head>
<title>Smart Ambulance Traffic System</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
margin:0;
padding:0;
height:100vh;
display:flex;
flex-direction:column;
}

h1{
text-align:center;
margin:10px;
}

form{
text-align:center;
margin-bottom:10px;
}

.main-container{
flex:1;
display:flex;
width:96%;
margin:auto;
gap:20px;
height:calc(100vh - 120px);
}

.video-box{
flex:3;
background:black;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.video-box img{
width:100%;
height:100%;
object-fit:contain;
}

.signal-box{
flex:1;
background:white;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px;
}

.light{
height:90px;
width:90px;
border-radius:50%;
margin:20px;
background:gray;
}

#red{background:red}
#yellow{background:gray}
#green{background:gray}

#signal{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

#count{
font-size:28px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🚦 Smart Traffic Signal System</h1>

<form method="POST" enctype="multipart/form-data">
<input type="file" name="video" required>
<button type="submit">Upload Video</button>
</form>

{% if video %}

<div class="main-container">

<div class="video-box">
<img src="{{ url_for('video_feed') }}">
</div>

<div class="signal-box">

<div id="red" class="light"></div>
<div id="yellow" class="light"></div>
<div id="green" class="light"></div>

<div id="signal">RED</div>

<h3>🚑 Ambulances Detected</h3>
<div id="count">0</div>

</div>

</div>

{% endif %}

<script>

setInterval(function(){

fetch('/signal_status')

.then(res=>res.json())

.then(data=>{

document.getElementById("signal").innerHTML=data.signal
document.getElementById("count").innerHTML=data.count

document.getElementById("red").style.background="gray"
document.getElementById("yellow").style.background="gray"
document.getElementById("green").style.background="gray"

if(data.signal=="RED"){
document.getElementById("red").style.background="red"
}

if(data.signal=="YELLOW"){
document.getElementById("yellow").style.background="yellow"
}

if(data.signal=="GREEN"){
document.getElementById("green").style.background="green"
}

})

},1000)

</script>

</body>
</html>
